name: "Build and Release APK"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.2.4)'
        required: true
        type: string
        default: '1.2.4'
      release_notes:
        description: 'Release Notes for in-app display'
        required: false
        type: string
        default: 'Bug fixes and cricket scoring engine improvements'
      is_mandatory:
        description: 'Is this update mandatory?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks
          elif [ -f app/keystore/release.jks ]; then
            echo "Using existing repository keystore."
          else
            echo "Generating production release keystore..."
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -alias igccxikey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass igccxicricketpass \
              -keypass igccxicricketpass \
              -dname "CN=IGCC XI Cricket Scorer, OU=Mobile, O=IGCC XI, L=Bengaluru, ST=Karnataka, C=IN"
          fi

      - name: Compute Versioning Metadata
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            TAG_NAME="v${VERSION_NAME}"
            NOTES="${{ github.event.inputs.release_notes }}"
            MANDATORY="${{ github.event.inputs.is_mandatory }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
            NOTES="Release ${TAG_NAME} automatically published via GitHub Actions."
            MANDATORY="false"
          fi

          IFS='.' read -r -a PARTS <<< "$VERSION_NAME"
          MAJOR=${PARTS[0]:-1}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "MANDATORY=${MANDATORY}" >> "$GITHUB_OUTPUT"
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} -PversionName=${{ steps.versioning.outputs.VERSION_NAME }} --no-daemon

      - name: Prepare Release Artifacts & Metadata
        id: metadata
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/IGCC-XI-v${{ steps.versioning.outputs.VERSION_NAME }}.apk release_artifacts/IGCC-XI.apk

          FILE_SIZE=$(wc -c < release_artifacts/IGCC-XI.apk | tr -d ' ')
          DATE=$(date +'%Y-%m-%d')
          TAG_NAME="${{ steps.versioning.outputs.TAG_NAME }}"
          VERSION_NAME="${{ steps.versioning.outputs.VERSION_NAME }}"
          VERSION_CODE="${{ steps.versioning.outputs.VERSION_CODE }}"
          NOTES="${{ steps.versioning.outputs.NOTES }}"
          MANDATORY="${{ steps.versioning.outputs.MANDATORY }}"

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "FILE_SIZE=${FILE_SIZE}" >> "$GITHUB_OUTPUT"
          echo "DATE=${DATE}" >> "$GITHUB_OUTPUT"
          echo "MANDATORY=${MANDATORY}" >> "$GITHUB_OUTPUT"

          # Use jq to reliably create app-update.json with valid formatting
          jq -n \
            --arg vCode "$VERSION_CODE" \
            --arg vName "$VERSION_NAME" \
            --arg notes "$NOTES" \
            --arg dlUrl "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/IGCC-XI.apk" \
            --argjson mandatory "$MANDATORY" \
            --argjson fSize "$FILE_SIZE" \
            --arg date "$DATE" \
            '{
              latestVersionCode: ($vCode | tonumber),
              latestVersionName: $vName,
              releaseNotes: $notes,
              downloadUrl: $dlUrl,
              isMandatory: $mandatory,
              minSupportedVersionCode: 1,
              fileSizeBytes: $fSize,
              releaseDate: $date
            }' > app-update.json

          echo "Generated app-update.json:"
          cat app-update.json
          cp app-update.json /tmp/app-update.json

          # Generate release notes markdown
          {
            echo "## 🏏 IGCC XI Cricket - Release ${TAG_NAME}"
            echo ""
            echo "### 🚀 What's New:"
            echo "${NOTES}"
            echo ""
            echo "---"
            echo "### 📦 Download & Install:"
            echo "- **Direct APK**: [IGCC-XI.apk](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/IGCC-XI.apk)"
            echo "- **Package Size**: ~${FILE_SIZE} bytes"
            echo "- **Release Date**: ${DATE}"
            echo "- **In-App Auto-Update**: Users of the app will automatically receive this update notification within the app!"
          } > release_body.md

      - name: Update app-update.json in Repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git checkout main || git checkout -b main origin/main
          cp /tmp/app-update.json app-update.json
          git add app-update.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update app-update.json for ${{ steps.metadata.outputs.TAG_NAME }} [skip ci]" || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main || echo "Direct push to main branch was skipped or blocked by branch protection."
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.metadata.outputs.TAG_NAME }}"
          TITLE="IGCC XI v${{ steps.metadata.outputs.VERSION_NAME }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release notes and assets..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_body.md
            gh release upload "$TAG" release_artifacts/IGCC-XI.apk app-update.json --clobber
          else
            echo "Creating new release for $TAG..."
            gh release create "$TAG" \
              release_artifacts/IGCC-XI.apk \
              app-update.json \
              --title "$TITLE" \
              --notes-file release_body.md
          fi
          echo "GitHub Release published successfully!"

      - name: Purge jsDelivr CDN Cache
        continue-on-error: true
        run: |
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@main/app-update.json || true
          echo "Purged jsDelivr CDN cache for app-update.json"
