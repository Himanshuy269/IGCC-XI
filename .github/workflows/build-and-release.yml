name: Build & Release APK (In-App Auto-Update)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      release_notes:
        description: 'Release Notes for in-app display'
        required: false
        default: '• Dedicated Top Batsmen & Bowlers Leaderboard with career stats\n• Single-player identity deduplication\n• Built-in In-App Auto-Updater via GitHub Releases\n• Smooth 120fps animations and modern cricket emerald theme'
      is_mandatory:
        description: 'Is this update mandatory?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.jks
          elif [ -f app/keystore/release.jks ]; then
            echo "Using existing repository keystore."
          else
            echo "Generating production release keystore..."
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -alias igccxikey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass igccxicricketpass \
              -keypass igccxicricketpass \
              -dname "CN=IGCC XI Cricket Scorer, OU=Mobile, O=IGCC XI, L=Bengaluru, ST=Karnataka, C=IN"
          fi

      - name: Compute Versioning Metadata
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            TAG_NAME="v${VERSION_NAME}"
            NOTES="${{ github.event.inputs.release_notes }}"
            MANDATORY="${{ github.event.inputs.is_mandatory }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
            NOTES="Release ${TAG_NAME} automatically published via GitHub Actions."
            MANDATORY="false"
          fi

          IFS='.' read -r -a PARTS <<< "$VERSION_NAME"
          MAJOR=${PARTS[0]:-1}
          MINOR=${PARTS[1]:-0}
          PATCH=${PARTS[2]:-0}
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "MANDATORY=${MANDATORY}" >> $GITHUB_OUTPUT
          echo "NOTES=${NOTES}" >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} -PversionName=${{ steps.versioning.outputs.VERSION_NAME }} --no-daemon

      - name: Prepare Release Artifacts & Metadata
        id: metadata
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/IGCC-XI.apk
          cp app/build/outputs/apk/release/app-release.apk "release_artifacts/IGCC XI.apk"

          FILE_SIZE=$(wc -c < release_artifacts/IGCC-XI.apk)
          DATE=$(date +'%Y-%m-%d')
          TAG_NAME="${{ steps.versioning.outputs.TAG_NAME }}"
          VERSION_NAME="${{ steps.versioning.outputs.VERSION_NAME }}"
          VERSION_CODE="${{ steps.versioning.outputs.VERSION_CODE }}"
          NOTES="${{ steps.versioning.outputs.NOTES }}"
          MANDATORY="${{ steps.versioning.outputs.MANDATORY }}"

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "FILE_SIZE=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "DATE=${DATE}" >> $GITHUB_OUTPUT
          echo "MANDATORY=${MANDATORY}" >> $GITHUB_OUTPUT
          echo "NOTES=${NOTES}" >> $GITHUB_OUTPUT

          # Create updated app-update.json
          cat <<EOF > app-update.json
{
  "latestVersionCode": ${VERSION_CODE},
  "latestVersionName": "${VERSION_NAME}",
  "releaseNotes": "${NOTES}",
  "downloadUrl": "https://github.com/Himanshuy269/IGCC-XI/releases/download/${TAG_NAME}/IGCC-XI.apk",
  "isMandatory": ${MANDATORY},
  "minSupportedVersionCode": 1,
  "fileSizeBytes": ${FILE_SIZE},
  "releaseDate": "${DATE}"
}
EOF

          echo "Generated app-update.json:"
          cat app-update.json

      - name: Commit & Push app-update.json to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git checkout -B main origin/main || git checkout main
          cp app-update.json /tmp/app-update.json
          git pull --rebase origin main || true
          cp /tmp/app-update.json app-update.json
          git add app-update.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): update app-update.json for ${{ steps.metadata.outputs.TAG_NAME }} [skip ci]" && git push origin main)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.TAG_NAME }}
          name: "IGCC XI v${{ steps.metadata.outputs.VERSION_NAME }}"
          body: |
            ## 🏏 IGCC XI Cricket - Release v${{ steps.metadata.outputs.VERSION_NAME }}

            ### 🚀 What's New:
            ${{ steps.metadata.outputs.NOTES }}

            ---
            ### 📦 Download & Install:
            - **Direct APK**: [`IGCC-XI.apk`](https://github.com/Himanshuy269/IGCC-XI/releases/download/${{ steps.metadata.outputs.TAG_NAME }}/IGCC-XI.apk)
            - **Package Size**: ~${{ steps.metadata.outputs.FILE_SIZE }} bytes
            - **Release Date**: ${{ steps.metadata.outputs.DATE }}
            - **In-App Auto-Update**: Users of the app will automatically receive this update notification within the app!
          files: |
            release_artifacts/IGCC-XI.apk
            release_artifacts/IGCC XI.apk
            app-update.json
          draft: false
          prerelease: false
